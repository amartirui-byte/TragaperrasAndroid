// Indica dónde buscar el plugin de Android y las bibliotecas del proyecto.
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
// El proyecto tiene un único módulo Android: app.
rootProject.name = 'TragaperrasAndroid'
include ':app'
